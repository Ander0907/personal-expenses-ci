[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "D", "ANN", "S", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["app"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
