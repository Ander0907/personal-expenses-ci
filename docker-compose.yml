name: personal-expenses

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required - copy .env.example to .env}
    volumes:
      - expenses-db-data:/var/lib/postgresql/data
    networks:
      - expenses-net
    # Deliberately NO "ports": the database is reachable only from inside
    # expenses-net (i.e. by the api service), never from the host.
    healthcheck:
      # -h 127.0.0.1 forces TCP: during first-time init the image runs a temporary
      # socket-only server that would otherwise report "ready" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    # This tag must match the tag produced by docker/build-push-action in CI,
    # so that "docker compose up" (without --build) uses the prebuilt image.
    image: personal-expenses-api:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required - copy .env.example to .env}
      # The compose service name resolves via Docker DNS on expenses-net.
      # Never use localhost or an IP address here.
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
    ports:
      # Bound to the loopback interface only: reachable from this machine,
      # not from other hosts on a shared network.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Repeats the Dockerfile HEALTHCHECK values exactly.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - expenses-net
    restart: unless-stopped

networks:
  expenses-net:
    name: expenses-net
    driver: bridge

volumes:
  expenses-db-data:
    name: expenses-db-data
