name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled; every push to a branch keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.16"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
            api/constraints.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      # pyproject addopts enforce the coverage gate (--cov-fail-under=90)
      - name: Run unit tests
        run: pytest

  docker:
    name: Build image & smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Created before the build so the always()/failure() compose steps
      # below can still interpolate variables if the build fails.
      - name: Create .env from example
        # .env.example holds fake, non-sensitive test values
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build API image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./api
          push: false
          load: true
          # Must match the `image:` of the api service in docker-compose.yml exactly
          tags: personal-expenses-api:local
          cache-from: type=gha,scope=personal-expenses-api
          cache-to: type=gha,mode=max,scope=personal-expenses-api

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start stack
        # --no-build fails clearly if the image tag above does not match compose
        run: docker compose up -d --wait --no-build --wait-timeout 120

      - name: Show running services
        run: docker compose ps

      - name: Smoke test
        env:
          BASE_URL: http://127.0.0.1:8000
        run: bash scripts/smoke_test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
